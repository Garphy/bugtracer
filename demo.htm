
<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>demo</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="img/fileuploader.css" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="img/jquery.min.js"></script>
<script type="text/javascript">
var isAdmin = 1;
var cur_pid = '0';
var cur_ver = '';
var cur_type = '53';
var G_status = ['closed', 'new', 'key', 'part_fixed', 'fixed', 'wont_fix', 'todo', 'idea'];
var G_status_default = 1;
var G_status_fixed = 4;
</script>
<style>
.queue { margin:1em;}
.queue li { display:inline-block;float:left; line-height:2em; padding:0 5px 0 15px; background:url(img/arrow_10.gif) no-repeat 5px 50%;}
.queue li:first-child { padding:0 5px; background:none;}
.queue li a {display:none;}
.queue li:hover { background-color:#e1e1e1;}
.queue li:hover a {display:inline; padding-left:5px; color:red;}
.queue label { display:inline-block; line-height:2em;}
</style>
</head>
<body>

<p>左右拖拽调整顺序</p>
<div>

<ul class="queue">
	<li class="one" uid="1">某某某1<a href="javascript:void(0)" class="del">X</a></li>
	<li class="one" uid="2">某某某2<a href="javascript:void(0)" class="del">X</a></li>
	<li class="one" uid="3">某某某3<a href="javascript:void(0)" class="del">X</a></li>
</ul>
<!-- <label><input type="checkbox" id="delMode">删除</label> -->

<input type="text" id="qids" />

</div>

<script>
$(function(){
//---------
Array.prototype.min = function() {
var min = this[0];
var index = 0;
var len = this.length;
for (var i = 1; i < len; i++){
		if (this[i] < min){
				min = this[i];
		}
} 
return min;
}
//---------

var keyf = true;//变量控制第一次拖拽结束前，不允许其他操作
var queue = $('.queue');
init();

function init(){
		/*$('#delMode').click(function(){
			if( $(this).prop('checked') ){
				queue.addClass('delList');
			}else{				
				queue.removeClass('delList');
			}
		});*/
		//mouse event
		$('.del').off('mousedown').on('mousedown',function(){//绑定删除元素
				keyf = false;
				$(this).parent().remove();
		});
		queue.find('li').off('mousedown').on({'mousedown':moused,'mouseover':function(){
				return false;
		}});//绑定mousedown事件
		var scrollLength = null;
		function moused(ev){            //mousedown
				if(keyf == false){return};//如果之前还有未完成的操作，那么return
				keyf = false;
				scrollLength = $(window).scrollTop() - 20;//保持滚动之后，不会错位，为了优化显示效果，减去20
				var allLeft = [];
				var allLi = queue.find('li');
				for(var i = 0 ; i < allLi.length ; i++){//拿到ul当中所有li距离顶部的距离
						allLeft.push(allLi.eq(i).offset().left);
				}
				var _this = $(this);
				var l = $(this).offset().left - 0;
				var t = $(this).offset().top;
				let mX = ev.clientX,
						mY = ev.clientY + scrollLength,
						disX = mX - l,    //确定鼠标按下的位置
						disY = mY - t;
				$(this).css({'position': 'absolute','left':l +'px','top':t +'px'});//将点击元素从不同文档流中的元素，变成定位元素
				var html = $(this).html();//拿到当前元素的 内容和class，复制成影子
				var aCls = $(this).attr('class');
				$(this).after('<li class="addLi '+aCls+'" style="opacity:.4">'+html+'</li>');
				$(document).on({'mousemove':mousem,'mouseup':mouseu});
				//将move，up事件，绑定在document身上，防止快速拖拽容易丢失的问题
				function mousem(ev){          //mousemove
						keyf = false;
						var setArr = [];
						scrollLength = $(window).scrollTop() - 20; //解决滚动条问题
						let mX = ev.clientX,
								mY = ev.clientY + scrollLength,//鼠标距离加上滚动的距离，防止滚动之后错位
								l = mX - disX;
								t = mY - disY;
						_this.css({'left':l+'px','top':t+'px'})//修改left，top形成拖拽
						for(var i = 0 ;i < allLeft.length ; i++){//循环之前拿到的所有Li的top数组
								var zo = mX - allLeft[i];  //使用鼠标的top，减去所有的li的top，(也就是鼠标到所有li的距离)
								setArr.push(zo < 0?zo*-1:zo); //所有距离转化成正数
						}
						var arrMin = setArr.min();//拿到鼠标到所有li的距离中的最小数(离鼠标最近li)
						var minIndex = setArr.indexOf(arrMin,0);//查找距离鼠标最近的li的下标
						var allLi2 = queue.find('li');
						if(minIndex == 0){//如果距离鼠标最近的是第一个
								mX < allLi2.eq(0).offset().left ? allLi2.eq(0).before($('.addLi')):allLi2.eq(0).after($('.addLi'));
								//再判断鼠标的的位置在不在第一个元素的上面，在上面，就往li[0]的前面插入，否则在后面插入
						}else if (minIndex == allLeft.length -1){
								//最后一个元素，和第一个道理一样，写法相反
								mX > allLi2.eq(allLeft.length).offset().left ? allLi2.eq(allLeft.length).after($('.addLi')):allLi2.eq(allLeft.length).before($('.addLi'));
						}else{
								//中间元素
								allLi2.eq(minIndex).after($('.addLi'));//将影子插入到 距离鼠标最近li的后面
						}
				}
				function mouseu(){         //mouseup
						var ol = $('.addLi').offset().left;//拿到影子元素的坐标
						var ot = $('.addLi').offset().top;
						$(document).off({'mousemove':mousem,'mouseup':mouseu});//将拖拽元素的left，top变化到影子的目标坐标上
						_this.animate({'left':ol -3,'top':ot},function(){//减3，是为了优化视觉效果
								_this.css('position','static');//取消定位
								$('.addLi').after(_this);//将目标元素插入到影子元素后面
								$('.addLi').remove();//删除影子元素
								keyf = true;//结束动作
								getQids();
						})
				}
				return false
		}
		
}

function getQids(){
	var arr = [];
	$('.one').each(function( i, o ){
		arr.push($(o).attr('uid'));
	});
	$('#qids').val( arr.join(',') );
}

})
/*
单个可以删
可以左右移动
单击切换当前分配bug用户
*/
</script>
</body></html>
